  - status: published
    year: 2017
    authors: "P.-O. Parisé, T. Ransford & D. Rochon"
    title: "Tricomplex Dynamical Systems Generated by Polynomials of Even Degree"
    venue: "CMSIM"
    citation: "Chaotic Modeling and Simulation (CMSIM), Vol. 1, pp. 38–49 (2017)."
    links:
      - {label: arXiv, url: "https://arxiv.org/abs/1603.08548"}
    abstract: >-
      In this article, we give the exact interval of the cross section of the Multibrot sets
      generated by the polynomial \(z^p+c\) where \(z\) and \(c\) are complex numbers and
      \(p \geq 2\) is an even integer. Furthermore, we show that the same Multibrots defined on the
      hyperbolic numbers are always squares. Moreover, we give a generalized 3D version of the
      hyperbolic Multibrot set and prove that our generalization is an octahedron for a specific 3D
      slice of the tricomplex polynomial \(\eta^p+c\) where \(p \geq 2\) is an even integer.

  - status: published
    year: 2017
    authors: "P.-O. Parisé & D. Rochon"
    title: "Tricomplex Dynamical Systems Generated by Polynomials of Odd Degree"
    venue: "Fractals"
    citation: "Fractals, Vol. 25 (3), 11 pp. (2017)."
    links:
      - {label: arXiv, url: "https://arxiv.org/abs/1511.02249"}
    abstract: >-
      In this article, we give the exact interval of the cross section of the Multibrot sets
      generated by the polynomial \(z^p+c\) where \(z\) and \(c\) are complex numbers and \(p > 2\)
      is an odd integer. Furthermore, we show that the same Multibrots defined on the hyperbolic
      numbers are always squares. Moreover, we give a generalized 3D version of the hyperbolic
      Multibrot set and prove that our generalization is an octahedron for a specific 3D slice of the
      dynamical system generated by the tricomplex polynomial \(\eta^p+c\) where \(p > 2\) is an odd
      integer.

  - status: published
    year: 2015
    authors: "P.-O. Parisé & D. Rochon"
    title: "A Study of Dynamics of the Tricomplex Polynomials \\(\\eta^p + c\\)"
    venue: "Nonlinear Dyn."
    citation: "Nonlinear Dynamics, Vol. 82 (1), pp. 157–171 (2015)."
    links:
      - {label: arXiv, url: "https://arxiv.org/abs/1411.0965"}
    abstract: >-
      In this article, we give the exact interval of the cross section of the so called Mandelbric
      set generated by the polynomial \(z^3+c\) where \(z\) and \(c\) are complex numbers. Following
      that result, we show that the Mandelbric defined on the hyperbolic numbers \(\mathbb{D}\) is a
      square with its center at the origin. Moreover, we define the Multibrot sets generated by a
      polynomial of the form \(Q_{p,c}(\eta)=\eta^p+c\) (\(p \in \mathbb{N}\) and \(p \geq 2\)) for
      tricomplex numbers. More precisely, we prove that the tricomplex Mandelbric has four principal
      slices instead of eight principal 3D slices that arise for the case of the tricomplex
      Mandelbrot set. Finally, we prove that one of these four slices is an octahedron.
