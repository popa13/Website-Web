  - status: published
    year: 2021
    authors: "J. Mashreghi, P.-O. Parisé & T. Ransford"
    title: "Cesàro Summability of Taylor Series in Weighted Dirichlet Spaces"
    venue: "Complex Anal. Oper. Theory"
    citation: "Complex Analysis and Operator Theory, Vol. 15, art. 7 (2021)."
    links:
      - {label: DOI, url: "https://doi.org/10.1007/s11785-020-01058-3"}
      - {label: arXiv, url: "https://arxiv.org/abs/2009.12295"}
    abstract: >-
      We show that, in every weighted Dirichlet space on the unit disk with superharmonic weight, the
      Taylor series of a function in the space is \((C,\alpha)\)-summable to the function in the norm
      of the space, provided that \(\alpha>1/2\). We further show that the constant \(1/2\) is sharp,
      in marked contrast with the classical case of the disk algebra.

  - status: published
    year: 2019
    authors: "G. Brouillette, P.-O. Parisé & D. Rochon"
    title: "Tricomplex Distance Estimation for Filled-in Julia Sets and Multibrot Sets"
    venue: "Int. J. Bifurc. Chaos"
    citation: "International Journal of Bifurcation and Chaos, Vol. 29 (6), 1950085, 15 pp. (2019)."
