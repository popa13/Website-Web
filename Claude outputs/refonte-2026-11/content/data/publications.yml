  - status: accepted
    year: 2026
    authors: "K. Lazebnik, P.-O. Parisé & M. Younsi"
    title: "Rational Lemniscates and the Matching Problem"
    venue: "J. Lond. Math. Soc."
    citation: "Journal of the London Mathematical Society, to appear (2026)."
    links:
      - {label: arXiv, url: "https://arxiv.org/abs/2507.03547"}
    abstract: >-
      The matching problem for a given Jordan curve in the complex plane asks to find two
      nonconstant functions, one analytic in the bounded complementary component of the curve and
      the other analytic in the unbounded complementary component of the curve, which are continuous
      up to the curve and complex conjugate to each other on the curve. We prove that there exist
      Jordan curves of any Hausdorff dimension between \(1\) and \(2\) for which the matching problem
      has a solution. This answers a question of Ebenfelt–Khavinson–Shapiro and provides the first
      examples of solutions to the matching problem other than rational lemniscates. Our approach
      relies on conformal welding and harmonic measure. We also obtain new examples of Jordan curves
      for which the matching problem has no solution, and give a characterization of the subsets of
      the Riemann sphere that are rational lemniscates in terms of harmonic measure.

