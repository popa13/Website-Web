  - status: submitted
    year: 2026
    month: 10
    authors: "G. Brouillette, A. Goupil, P.-O. Parisé & F. Touré"
    title: "An Invariant Tangent-Angle Descriptor and a Band U-Net for 2D Fragment Adjacency Prediction"
    note: {en: "Submitted in October 2026", fr: "Soumis en octobre 2026"}
    links:
      - {label: arXiv, url: "https://arxiv.org/abs/2610.09459"}
    abstract: >-
      This paper addresses the prediction of adjacency between pairs of 2D fragments based on their
      contours. We improved the two-stage architecture proposed in Beaulac's thesis, in which a
      rotation-equivariant Siamese convolutional neural network scores pairs of local image windows
      along the two contours of two fragments. The scores are gathered in an adjacency matrix in which
      a ResNet detects the partial anti-diagonal band that reveals the adjacency of two fragments. In
      the current work, we keep the pipeline and replace the local score by a comparison of
      tangent-angle profiles of contour windows, making it, by construction, invariant to fragment
      rotation and agnostic to the selected contour-starting point. These adaptations may be either a
      training-free likelihood ratio or a small one-dimensional convolutional model trained on
      corresponding points. We also replaced the final classifier by a band U-Net that segments the
      band and classifies the pair, so that the shared arc is obtained along with the decision. In the
      synthetic data set of the original thesis, the tangent descriptor performs as well as or better
      than the image-window approach in all tested configurations. The proposed pipeline reaches an
      accuracy of 98%, vs 93% to 95% for the original approach once its evaluation is corrected. We
      tested our pipeline, with models trained only on synthetic data, on the PairingNet benchmark,
      and obtained an AUC of 0.93. Furthermore, under the PairingNet pair-searching protocol
      conditions, our learned descriptor obtains a Recall@10 of 0.82 on the real set against 0.56 from
      the best model of the original paper.

  - status: submitted
    year: 2026
    month: 8
    authors: "N. Doyon, P.-O. Parisé & W. Verreault"
    title: "Classes of Holomorphic Multicomplex-Valued Functions Generated by Elliptic-Admissible Involutions"
    note: {en: "Submitted in August 2026", fr: "Soumis en août 2026"}
    links:
      - {label: PDF, url: "documents/MC-InvoAndCReq-v01.pdf"}
      - {label: arXiv, url: "https://arxiv.org/abs/2211.13875"}
    abstract: >-
      We classify and count the real-algebra involutions of the multicomplex algebra
      \(\mathbb{M}\mathbb{C}(n)\) that map each element of its canonical monomial basis to a signed
      monomial, using a matrix model over \(\mathbb{F}_2\). An elliptic-admissible pair consists of
      such an involution \(\sigma\) and a monomial unit \(\mathbf{i}\in\mathbb{I}(n)\) satisfying
      \(\mathbf{i}^2=-1\) and \(\sigma(\mathbf{i})=-\mathbf{i}\). The fixed algebra of \(\sigma\) is a
      real form for the complex structure \(\mathcal{L}_{\mathbf{i}}\) defined by multiplication by
      \(\mathbf{i}\), and the pair yields a Cauchy–Riemann system. We prove that its solution class
      depends only on \(\mathbf{i}\), not on \(\sigma\), and is exactly the class of mappings
      holomorphic with respect to \(\mathcal{L}_{\mathbf{i}}\). Multicomplex holomorphy is recovered
      as the intersection of the classes associated with the elementary generators. We obtain the
      analogous characterization for anti-holomorphic classes, describe twisted systems intertwining
      two such complex structures, and prove that every \(\mathbf{i}\)-holomorphic or
      \(\mathbf{i}\)-anti-holomorphic mapping is componentwise harmonic (solutions to Laplace's
      equation).

  - status: submitted
    year: 2026
    month: 6
    authors: "L. Bouthat & P.-O. Parisé"
    title: "Weighted Hardy Inequalities for Nested Averages"
    note: {en: "Submitted in June 2026", fr: "Soumis en juin 2026"}
    links:
      - {label: arXiv, url: "https://arxiv.org/abs/2606.24044"}
    abstract: >-
      We study a family of Hardy-type inequalities for weighted averages over nested subsets of a
      measure space. Given a partition of a measure space and a weight function \(m\), we consider
      operators of the form
      \[ f \mapsto \frac{1}{M_n}\int_{X^{(n)}} m(x)f(x)\,\mathrm{d}\mu(x), \]
      with additional weights on the resulting sequence of averages. In particular, we generalize an
      inequality obtained by Vincent and Sohani (2025) and characterize the boundedness in terms of
      the finiteness of a single testing quantity \(\beta\). We also provide two-sided estimates for
      the best constant \(C_{\mathrm{opt}}\), namely
      \[ \beta \leq C_{\mathrm{opt}} \leq p^{1/q} (p')^{1/p'}\beta \leq 2\beta. \]
      Thus the characterization is never off by more than a factor of 2. We also develop a second
      approach, inspired by Broadbent's proof of Hardy's inequality, which gives a local sufficient
      condition that often provides sharper constants and recovers several important cases,
      including the classical weighted Hardy inequality.

