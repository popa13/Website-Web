    abstract: >-
      In this article, we present a distance estimation formula that can be used to ray trace 3D
      slices of the filled-in Julia sets and the Multibrot sets generated by the tricomplex
      polynomials of the form \(\eta^p+c\) where \(p\) is any integer greater than \(1\).

