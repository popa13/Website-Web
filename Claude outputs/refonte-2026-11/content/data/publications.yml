# =====================================================================
#  Publications — read by build.py
#
#  In content/<lang>/research.md, the tokens
#      <!-- PUBLICATIONS:submitted -->
#      <!-- PUBLICATIONS:accepted -->
#      <!-- PUBLICATIONS:published -->
#  are replaced by a table: one row per paper; clicking a row opens the
#  abstract, the full reference and the links (same idea as the seminars).
#
#  To add a paper: copy an entry and change the fields.
#  Required: status, year, authors, title.  Everything else is optional.
#
#    status   : submitted | accepted | published
#    year     : year of publication (published) or of submission
#    month    : optional, 1–12 (most recent first); otherwise papers keep
#               the order of this file within a year
#    authors  : as they should be printed; "P.-O. Parisé" is put in bold
#    title    : LaTeX is fine between \( \) or $ $
#    venue    : short name shown in the table (e.g. "Constr. Approx.")
#    citation : full reference shown when the row is opened
#    note     : {en: ..., fr: ...} e.g. "Submitted in October 2026"
#    abstract : plain text + LaTeX; leave a blank line between paragraphs.
#               {en: ..., fr: ...} is also accepted.
#    links    : list of {label, url}. Relative urls (documents/...) are
#               fixed automatically for the French pages.
#
#  When a paper moves from "submitted" to "accepted" to "published",
#  change `status` (and add venue / citation / DOI). That's it.
# =====================================================================

sections:
  submitted:
    id: SubArticles
    title: {en: "Submitted articles", fr: "Articles soumis"}
  accepted:
    id: AccArticles
    title: {en: "Accepted articles", fr: "Articles acceptés"}
  published:
    id: PubArticles
    title: {en: "Published articles", fr: "Articles publiés"}

publications:

