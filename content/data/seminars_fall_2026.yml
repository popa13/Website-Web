seminars:
  - date: "2026-09-24"
    title:
      en: "What does it depend on? An introduction to multivariate modelling"
      fr: "Ça dépend de quoi? Une introduction à la modélisation multivariée"
    speaker:
      name: "Samuel Valiquette"
      affiliation:
        en: "Université de Sherbrooke"
        fr: "Université de Sherbrooke"
      affiliation-short: "UdeS"
    abstract:
      en: "In probability and statistics, it is often necessary to model and study the random behaviour of several random variables simultaneously. A fundamental question is then to quantify and describe the dependence relationships between the components of a random vector of arbitrary dimension. But what exactly do we mean by dependence? Given two distinct random vectors, how can we determine which one exhibits a stronger dependence structure than the other?

In this talk, we will try to answer these questions by introducing the concept of a copula. We will first motivate its definition through an example of dependence modelling, and then formalize it using Sklar's fundamental theorem (1959). We will then examine some important properties, as well as a particular class of copulas. Finally, we will see how copulas make it possible to quantify the degree of dependence between random variables through dependence measures that are expressed solely in terms of the copula, such as Kendall's tau."
      fr: "En probabilités et en statistique, il est souvent nécessaire de modéliser et d'étudier le comportement aléatoire de plusieurs variables aléatoires simultanément. Une question fondamentale consiste alors à quantifier et à décrire les relations de dépendance entre les composantes d'un vecteur aléatoire de dimension quelconque. Mais qu'entend-on exactement par dépendance? Étant donné deux vecteurs aléatoires distincts, comment peut-on déterminer lequel présente une structure de dépendance plus forte que l'autre?

Dans cette présentation, nous tenterons de répondre à ces questions en introduisant le concept de copule. Nous motiverons d'abord sa définition à partir d’un exemple de modélisation de la dépendance, puis nous la formaliserons à l'aide du théorème fondamental de Sklar (1959). Nous examinerons ensuite certaines propriétés importantes ainsi qu’une classe particulière de copules. Enfin, nous verrons comment les copules permettent de quantifier le degré de dépendance entre variables aléatoires à l'aide de mesures de dépendance qui s'expriment uniquement en fonction de celles-ci, telles que le tau de Kendall."
    youtube:
      id: 'MYPnUHlN8iI'

  - date: "2026-10-08"
    title:
      en: "What would a Mandelbrot set look like in three dimensions ?"
      fr: "Que serait un ensemble de Mandelbrot en trois dimensions ?"
    speaker:
      name: "Pierre-Olivier Parisé"
      affiliation:
        en: "Université du Québec à Trois-Rivières"
        fr: "Université du Québec à Trois-Rivières"
      affiliation-short: "UQTR"
    abstract:
      en: "The Mandelbrot set is a fascinating object. Defined through the iteration of a polynomial of degree two, it captures many phenomena closely tied to the filled Julia set of a quadratic polynomial. Since the 1980s, many have attempted to generalize these sets to three-dimensional space using various techniques. Notable examples include Norton's quaternionic Julia sets and the triplex numbers of White and Nylander, which led to what is known as the Mandelbulb.

In this talk, I will give a brief overview of the theory of polynomial iteration and introduce our main protagonists: the Mandelbrot set and filled Julia sets. I will then describe some of these attempts to generalize the sets to three-dimensional space. I will also explain why a direct generalization to three dimensions might be impossible. Finally, I will present an approach that generalizes the Mandelbrot set and filled Julia sets using multicomplex numbers, as well as related work in this setting.

The last part of the talk, devoted to multicomplex filled Julia sets, is joint work with Quentin Charles."
      fr: "L'ensemble de Mandelbrot est un objet fascinant. Défini à partir de l'itération d'un polynôme de degré deux, il rend compte de nombreux phénomènes étroitement liés à l'ensemble de Julia rempli d'un polynôme de degré deux. Depuis les années 1980, nombreux sont ceux qui ont tenté de généraliser ces ensembles à l'espace tridimensionnel à l'aide de diverses techniques. On pense entre autres aux ensembles de Julia quaternioniques de Norton et aux nombres triplex de White et Nylander, qui ont mené à ce qu'on appelle le « Mandelbulb ».

Dans cet exposé, je donnerai un bref aperçu de la théorie de l'itération des polynômes et je présenterai nos principaux protagonistes : l'ensemble de Mandelbrot et les ensembles de Julia remplis. Je décrirai ensuite quelques-unes de ces tentatives pour généraliser ces ensembles à l'espace tridimensionnel. J'expliquerai aussi pourquoi une généralisation directe en trois dimensions pourrait être impossible. Enfin, je présenterai une approche qui généralise l'ensemble de Mandelbrot et les ensembles de Julia remplis à l'aide des nombres multicomplexes, ainsi que des travaux connexes dans ce cadre.

La dernière partie de l'exposé, consacrée aux ensembles de Julia remplis multicomplexes, est un travail en collaboration avec Quentin Charles."
    youtube:
      id: 'c-hlMjv7GzI'

  - date: "2026-10-22"
    title:
      en: "What would a Mandelbrot set look like in three dimensions ?"
      fr: "Fantastic Integer Sequences and Where to Find Them"
    speaker:
      name: "Alejandro Morales Borrero"
      affiliation:
        en: "Université du Québec à Montréal"
        fr: "Université du Québec à Montréal"
      affiliation-short: "UQAM"
    abstract:
      en: "In the talk, we will discuss what enumerative combinatorics is. We will then turn to fantastic integer sequences and where to find them in the mathematical and computational universes. We will give an overview of, and some new perspectives on, well-known sequences such as the Fibonacci numbers, the Euler numbers, and the ubiquity of the Catalan numbers. Finally, we will talk about partial orders and the enumeration of the linear extensions of a few of them."
      fr: "Dans l’exposé, on discutera de ce qu’est la combinatoire énumérative. Après, on parlera des suites de nombres entiers fantastiques et où les trouver dans l’univers mathématique et l’univers informatique. On fera un survol et de nouvelles perspectives sur des suites connues, comme les nombres de Fibonacci, d’Euler et l’ubiquité des nombres de Catalan. Finalement, on parlera des ordres et de l'énumération des extensions linéaires de quelques-uns de ces ordres."
