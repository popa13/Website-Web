  - status: published
    year: 2015
    authors: "P.-O. Parisé & D. Rochon"
    title: "A Study of Dynamics of the Tricomplex Polynomials \\(\\eta^p + c\\)"
    venue: "Nonlinear Dyn."
    citation: "Nonlinear Dynamics, Vol. 82 (1), pp. 157–171 (2015)."
    links:
      - {label: arXiv, url: "https://arxiv.org/abs/1411.0965"}
    abstract: >-
      In this article, we give the exact interval of the cross section of the so called Mandelbric
      set generated by the polynomial \(z^3+c\) where \(z\) and \(c\) are complex numbers. Following
      that result, we show that the Mandelbric defined on the hyperbolic numbers \(\mathbb{D}\) is a
      square with its center at the origin. Moreover, we define the Multibrot sets generated by a
      polynomial of the form \(Q_{p,c}(\eta)=\eta^p+c\) (\(p \in \mathbb{N}\) and \(p \geq 2\)) for
      tricomplex numbers. More precisely, we prove that the tricomplex Mandelbric has four principal
      slices instead of eight principal 3D slices that arise for the case of the tricomplex
      Mandelbrot set. Finally, we prove that one of these four slices is an octahedron.

  # ------------------------------------------------------------------
  # Theses (status: thesis)
  # ------------------------------------------------------------------
  - status: thesis
    year: 2021
    authors: "P.-O. Parisé"
    title: "Sommabilité du développement de Taylor dans les espaces de Banach de fonctions holomorphes"
    kind: {en: "Ph.D. thesis", fr: "Thèse de doctorat"}
    institution: "Université Laval"
    supervisor: "Thomas J. Ransford"
    note: {en: "Thesis in French.", fr: ""}
    links:
      - {label: PDF, url: "documents/etudes/Parise-Olivier_Parise_111142978-these-main.pdf"}
    abstract:
      fr: |
        Dans cette thèse, nous étudions la sommabilité du développement de Taylor de fonctions appartenant à certains espaces de Banach de fonctions holomorphes sur le disque unité.

        Le premier chapitre sert d’introduction à la théorie de la sommabilité dans les espaces de Banach. Nous y présentons les principaux concepts tels que la définition d’une méthode de sommabilité, la définition d’inclusion de méthodes de sommabilité et le théorème de Silverman-Toeplitz.

        La première partie comporte deux chapitres. Nous présentons les propriétés principales de certaines familles de méthodes de sommabilité. Plus précisément, nous présentons les principales méthodes de sommabilité étudiées dans cette thèse : les méthodes de Cesàro, les méthodes de Riesz arithmétiques et les méthodes de série de puissances dont les méthodes d’Abel généralisées, de Borel généralisées et la méthode logarithmique. Nous présentons aussi les relations entre chacune de ces méthodes lorsqu’elles sont restreintes aux suites de scalaires.

        La deuxième partie comporte deux chapitres et porte sur la sommabilité dans les espaces de Dirichlet pondérés \(\mathcal{D}_\omega\) où \(\omega\) est une fonction non-négative et surharmonique. Nous exposons brièvement ces espaces de Hilbert au premier chapitre de cette deuxième partie. Ensuite, nous montrons que les moyennes de Cesàro d’ordre \(\alpha > 1/2\) des sommes partielles de la série de Taylor convergent vers la fonction originale dans la norme de \(\mathcal{D}_\omega\). Lorsque \(\alpha = 1/2\), on montre que ce n’est plus le cas et il existe une fonction \(f \in \mathcal{D}_\omega\) telle que les moyennes de Cesàro d’ordre \(\alpha = 1/2\) des sommes partielles de sa série de Taylor ne sont pas bornées en norme. Ce résultat contraste grandement avec le résultat de M. Riesz pour l’espace \(A(\mathbb{D})\) (l’algèbre du disque) et le résultat de Hardy pour l’espace \(H^1\) (espace de Hardy). Les résultats de cette partie ont été publiés dans le journal Complex Analysis and Operator Theory.

        La troisième partie a trois chapitres et traite des espaces de de Branges-Rovnyak. Après avoir présenté brièvement la théorie de ces espaces au premier chapitre de cette partie, nous démontrons qu’il existe un espace de de Branges-Rovnyak de fonctions holomorphes sur le disque unité et une fonction \(f\) de cet espace avec les propriétés suivantes : même si \(f\) peut être approximée par des polynômes dans la norme de l’espace, ni les sommes partielles, ni les moyennes de Cesàro, d’Abel, de Borel et logarithmiques ne convergent vers \(f\) dans la norme de l’espace. L’instrument principal pour démontrer ce théorème est un résultat puissant, montré dans la première partie, qui permet d’étendre aux suites de vecteurs dans un espace de Banach une propriété d’une méthode de sommabilité vraie pour les suites de scalaires. Les résultats de cette partie ont été soumis au journal Integral Equations and Operator Theory.

        Enfin, la dernière partie de cette thèse traite d’un cas exceptionnel d’espace de Hilbert de fonctions holomorphes sur le disque unité. En utilisant le concept de base de Markushevich et en adaptant une construction de Johnson, nous construisons un espace de Hilbert de fonctions holomorphes sur le disque unité tel que les polynômes sont denses, mais les polynômes impairs ne sont pas denses dans l’espace des fonctions impaires. Comme conséquence de ce résultat, nous montrons qu’il existe une fonction \(f\) qui n’appartient pas à la fermeture de l’espace vectoriel engendré par les sommes partielles de la série de Taylor de \(f\). Ainsi, aucune méthode de sommabilité triangulaire appliquée aux sommes partielles ne permet d’approximer la fonction \(f\) dans la norme de l’espace. Les résultats de cette partie et quelques variantes de celui-ci ont été soumis au journal Constructive Approximation.
      en: |
        In this thesis, we study summability questions on the Taylor expansion of functions belonging to certain Banach spaces of holomorphic functions on the unit disk.

        The first chapter serves as an introduction to the theory of summability in Banach spaces. We present the main concepts such as the definition of a summability method, the definition of inclusion of summability methods and the Silverman-Toeplitz theorem in the Banach space setting.

        The first part consists of two chapters and presents the main properties of certain families of summability methods. More precisely, we present the main summability methods studied in this thesis: Cesàro’s methods, Riesz’s discrete arithmetic methods and power series methods including generalized Abel, generalized Borel and logarithmic methods. We also present the relations between each of these methods when they are restricted to sequences of scalars.

        The second part has two chapters and deals with summability in weighted Dirichlet spaces \(\mathcal{D}_\omega\) where \(\omega\) is a non-negative superharmonic function. We briefly introduce these Hilbert spaces in the first chapter of this second part. Then we show that the Cesàro means of order \(\alpha > 1/2\) of the partial sums of the Taylor series converge to the original function in the norm of \(\mathcal{D}_\omega\). When \(\alpha = 1/2\), we show that this is no longer the case and there exists a function \(f \in \mathcal{D}_\omega\) such that the Cesàro means of order \(\alpha = 1/2\) of the partial sums of its Taylor series are unbounded in norm. This result contrasts sharply with M. Riesz’s classical result on the convergence of Cesàro means of order \(\alpha > 0\) in the space \(A(\mathbb{D})\) (the disk algebra) and Hardy’s classical result on the convergence of the Cesàro means of order \(\alpha > 0\) in the space \(H^1\) (the Hardy space). The results of this part have been published in the journal Complex Analysis and Operator Theory.

        The third part consists of three chapters and treats the de Branges-Rovnyak spaces. After having briefly presented the theory of de Branges-Rovnyak spaces in the first chapter of this part, we prove that there exists a de Branges-Rovnyak space of holomorphic functions on the unit disk and a function \(f\) belonging to this space with the following properties: even if \(f\) can be approximated by polynomials in the norm of the space, neither the partial sums, nor the Cesàro, Abel, Borel and logarithmic means converge to \(f\) in the norm of the space. The main instrument to prove this theorem is a powerful result, established in the first part, which allows extending a property of a summability method valid over sequences of scalars to the sequences of vectors in a Banach space. The results of this part have been submitted to the journal Integral Equations and Operator Theory.

        Finally, the last part of this thesis treats an exceptional case of Hilbert space of holomorphic functions on the unit disk. Using the concept of a Markushevich basis and by adapting a construction of Johnson, we construct a Hilbert space of holomorphic functions on the unit disk such that the polynomials are dense but the linear vector space spanned by the odd polynomials is not dense in the space of odd functions. As a consequence of this result, we show that there exists a function \(f\) which does not belong to the closure of the linear span of the partial sums of the Taylor series of \(f\). Thus no triangular summability method applied to the partial sums can approximate the function \(f\) in the norm of the space. The results of this part and some variants of it have been submitted to the journal Constructive Approximation.

