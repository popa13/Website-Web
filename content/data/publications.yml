  - status: published
    year: 2026
    authors: "Q. Charles & P.-O. Parisé"
    title: "Classification of Principle 3D Slices of Filled-in Julia Sets in Multicomplex Spaces"
    venue: "Aequationes Math."
    citation: "Aequationes mathematicae, Vol. 100, art. #19 (2026)."
    links:
      - {label: DOI, url: "https://doi.org/10.1007/s00010-025-01257-3"}
    abstract: >-
      A generalization of the filled-in Julia set is presented using the multicomplex numbers and an
      algorithm is presented to visualize these sets in the tridimensional space. There are many ways
      to visualize these higher dimensional fractals sets on a computer. We therefore introduce an
      equivalence relation between 3D representations and show that, for the filled-in Julia sets
      associated to the polynomial \(z^p + c\), there are nine 3D slices when \(p\) is an odd integer
      and four when \(p\) is even. These results differs from the recent characterization obtained by
      Brouillette and Rochon in 2019 and the proofs require different arguments in the context of the
      filled-in Julia sets.

  - status: published
    year: 2025
    authors: "J.-S. Dessureault, R. Lamontagne & P.-O. Parisé"
    title: "The Ethics of Creating Artificial Superintelligence: A Global Risk Perspective"
    venue: "AI and Ethics"
    citation: "AI and Ethics, Vol. 5, pp. 6241–6263 (2025)."
    links:
      - {label: {en: "Open access", fr: "Accès libre"}, url: "https://link.springer.com/article/10.1007/s43681-025-00793-7"}
    abstract: >-
      As artificial intelligence (AI) continues its exponential growth and nears the threshold of
      artificial general intelligence (AGI), it is timely and urgent to initiate reflections on
      artificial superintelligence (ASI), which may emerge rapidly after AGI. While ASI remains
      hypothetical, its potential emergence could be abrupt and profoundly transformative,
      necessitating proactive ethical and strategic inquiry. This paper proposes a multidimensional
      reflection on ASI, not only in its technical form but also in relation to humanity and the
      planetary context. It seeks to answer the question: “Should Homo sapiens develop an artificial
      superintelligence on their planet?” The paper introduces key definitions, outlines major
      existential risks to humanity and the biosphere, and considers whether ASI could mitigate these
      threats. It ultimately proposes a conceptual equation to assess the potential net impact of ASI,
      and introduces an original Venn diagram that classifies problem domains across AI, AGI, and ASI.
      Together, these tools aim to advance theoretical understanding and guide future inquiry into
      the core research question.

  - status: published
    year: 2024
    authors: "P.-O. Parisé & T. Ransford"
    title: "On the Divergence of Taylor Series in de Branges–Rovnyak Spaces"
    venue: "Proc. AMS, Ser. B"
    citation: "Proceedings of the AMS, Series B, Vol. 11, pp. 126–132 (2024)."
    links:
      - {label: {en: "Open access", fr: "Accès libre"}, url: "https://www.ams.org/journals/bproc/2024-11-13/S2330-1511-2024-00176-8/S2330-1511-2024-00176-8.pdf"}
      - {label: arXiv, url: "https://arxiv.org/abs/2305.05716"}
    abstract: >-
      It is known that there exist functions in certain de Branges–Rovnyak spaces whose Taylor
      series diverge in norm, even though polynomials are dense in the space. This is often proved by
      showing that the sequence of Taylor partial sums is unbounded in norm. In this note we show that
      it can even happen that the Taylor partial sums tend to infinity in norm. We also establish
      similar results for lower-triangular summability methods such as the Cesàro means.

  - status: published
    year: 2024
    authors: "P.-O. Parisé"
    title: "Kernel-Summability Methods and the Silverman–Toeplitz Theorem"
    venue: "Contemp. Math."
    citation: "In Recent progress in function theory and operator theory, AMS Contemporary Mathematics, Vol. 799 (2024)."
    links:
      - {label: DOI, url: "https://doi.org/10.1090/conm/799"}
      - {label: arXiv, url: "https://arxiv.org/abs/2302.06770"}
    abstract: >-
      We introduce kernel-summability methods in Banach spaces using the vector-valued integrals and
      prove an analogue of the Silverman–Toeplitz Theorem for regular kernel-summability methods. We
      also show that if \(X\) is a Banach space and one kernel-summability method is included in
      another kernel-summability method for scalar-valued functions, then the first method is
      included in the second method, for \(X\)-valued functions. This extends a previous result from
      Javad Mashreghi, Thomas Ransford and the author. We then apply these abstract results to the
      summability of Taylor series of functions in a Banach space of holomorphic functions on the
      unit disk.

  - status: published
    year: 2022
    authors: "J. Mashreghi, P.-O. Parisé & T. Ransford"
    title: "Power-Series Summability Methods in de Branges–Rovnyak Spaces"
    venue: "Integral Equations Operator Theory"
    citation: "Integral Equations and Operator Theory, Vol. 94, art. 20 (2022)."
    links:
      - {label: DOI, url: "https://doi.org/10.1007/s00020-022-02698-0"}
      - {label: arXiv, url: "https://arxiv.org/abs/2103.06631"}
    abstract: >-
      We show that there exists a de Branges–Rovnyak space \(\mathcal{H}(b)\) on the unit disk
      containing a function \(f\) with the following property: even though \(f\) can be approximated
      by polynomials in \(\mathcal{H}(b)\), neither the Taylor partial sums of \(f\) nor their Cesàro,
      Abel, Borel or logarithmic means converge to \(f\) in \(\mathcal{H}(b)\). A key tool is a new
      abstract result showing that, if one regular summability method includes another for scalar
      sequences, then it automatically does so for certain Banach-space-valued sequences too.

  - status: published
    year: 2022
    authors: "J. Mashreghi, P.-O. Parisé & T. Ransford"
    title: "Failure of Approximation of Odd Functions by Odd Polynomials"
    venue: "Constr. Approx."
    citation: "Constructive Approximation, Vol. 56, pp. 35–43 (2022)."
    links:
      - {label: DOI, url: "https://doi.org/10.1007/s00365-021-09557-y"}
      - {label: arXiv, url: "https://arxiv.org/abs/2006.16871"}
    abstract: >-
      We construct a Hilbert holomorphic function space \(H\) on the unit disk such that the
      polynomials are dense in \(H\), but the odd polynomials are not dense in the odd functions in
      \(H\). As a consequence, there exists a function \(f\) in \(H\) that lies outside the closed
      linear span of its Taylor partial sums \(s_n(f)\), so it cannot be approximated by any
      triangular summability method applied to the \(s_n(f)\). We also show that there exists a
      function \(f\) in \(H\) that lies outside the closed linear span of its radial dilates
      \(f_r,\ r<1\).

