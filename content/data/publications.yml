    abstract:
      fr: |
        Dans ce mémoire, nous présentons une généralisation de l’ensemble de Mandelbrot dans le plan complexe, le plan hyperbolique et l’espace tricomplexe. Ces ensembles de Mandelbrot généralisés sont appelés Multibrot et ils sont générés par l’itération du polynôme \(z^p + c\) où \(p\) est un entier plus grand que 1.

        Précisément, l’algèbre normée des nombres tricomplexes est présentée en vue de définir, en toute généralité, les ensembles de Mandelbrot. Suite à cela, nous étudions certaines coupes de ces ensembles. D’abord, nous nous concentrons sur une coupe bidimensionnelle pour obtenir les ensembles de Mandelbrot d’ordre \(p\) dans le plan complexe. Nous montrons, dans le cas particulier où \(p = 3\), que l’intersection de cet ensemble de Mandelbrot avec l’axe réelle est exactement un intervalle. La méthode développée dans ce mémoire a ouvert la voie à une méthode plus générale afin de montrer que cette intersection est un intervalle pour toute puissance entière \(p \geq 2\). Ensuite, une autre coupe bidimensionnelle est effectuée afin d’obtenir les ensembles de Mandelbrot dans le plan hyperbolique. Nous montrons que ces ensembles sont en fait des carrés. Enfin, nous terminons ce mémoire en présentant une famille de coupes tridimensionnelles de certains ensembles de Mandelbrot tricomplexes. Nous montrons qu’il y a quatre coupes tridimensionnelles, dans le cas où \(p = 3\), au lieu de huit coupes dans le cas de l’ensemble de Mandelbrot tricomplexe classique.
      en: |
        In this memoir, we present a generalization of the Mandelbrot set in the complex plane, the hyperbolic plane and the tricomplex space. These Mandelbrot sets are called Multibrots and they are generated by iterating the polynomial \(z^p + c\) where \(p\) is an integer greater than 1.

        More precisely, the normed algebra of the tricomplex numbers is presented with a view to defining, in generality, the Mandelbrot sets. Following that, we study particular slices of these sets. First, we focus on a bidimensional slice to obtain the Mandelbrot sets of order \(p\) in the complex plane. We prove, in the particular case \(p = 3\), that the cross section of this Mandelbrot set with the real axis is exactly an interval. The technique used to prove the case \(p = 3\) opens the way to prove that in general, this intersection is really an interval. Afterwards, another bidimensional slice is cut to obtain the Mandelbrot sets in the hyperbolic plane. Furthermore, we show that these sets are, actually, squares. Lastly, we end this memoir by presenting a family of tridimensional slices of specific Mandelbrot sets. We show that, in the case \(p = 3\), there are exactly four principal slices, instead of eight for the classical tricomplex Mandelbrot set.

